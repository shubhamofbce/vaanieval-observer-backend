<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Dashboard · Vaani Observer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d1526'/%3E%3Cg fill='%2359d3ab'%3E%3Crect x='6' y='13' width='3' height='6' rx='1.5'/%3E%3Crect x='12' y='8' width='3' height='16' rx='1.5'/%3E%3Crect x='18' y='11' width='3' height='10' rx='1.5'/%3E%3Crect x='24' y='14' width='3' height='4' rx='1.5'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    /* Applied before first paint: reading the stored theme after paint means a
       frame of the wrong theme on every load. Kept inline and tiny for that
       reason — a separate file would be a blocking request in the same place. */
    (function(){try{var t=localStorage.getItem('vaani.theme');if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
  </script>
  <link rel="stylesheet" href="/assets/styles.css">
  <link rel="stylesheet" href="/assets/dashboard.css">
</head>
<body class="board-page">
  <a class="skip-link" href="#main">Skip to dashboard</a>

  <div class="workspace" data-workspace>
  <aside class="sidebar" id="sidebar" aria-label="Vaani Observer">
    <div class="sidebar-head">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="20" height="20"><g fill="currentColor"><rect x="4" y="13" width="3" height="6" rx="1.5"/><rect x="10" y="7" width="3" height="18" rx="1.5"/><rect x="16" y="10" width="3" height="12" rx="1.5"/><rect x="22" y="13" width="3" height="6" rx="1.5"/></g></svg>
      </span>
      <b class="brand-name">Vaani Observer</b>
      <button type="button" class="sidebar-toggle" id="sidebar-toggle" aria-expanded="true" aria-controls="sidebar" title="Collapse the sections rail  ·  n" aria-label="Collapse the sections rail">
        <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path fill="currentColor" d="M10.03 3.47a.75.75 0 0 1 0 1.06L6.56 8l3.47 3.47a.75.75 0 1 1-1.06 1.06L4.97 8.53a.75.75 0 0 1 0-1.06l4-4a.75.75 0 0 1 1.06 0Z"/></svg>
      </button>
    </div>
    <div data-nav-slot></div>
    <div class="sidebar-foot">
      <span class="conn-state" id="conn-state" role="status" aria-live="polite"></span>
      <button type="button" class="btn ghost sidebar-refresh" id="refresh" title="Reload sessions  ·  r" aria-label="Reload sessions">
        <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true" class="icon-refresh"><path fill="currentColor" d="M8 2.75a5.25 5.25 0 1 0 5.09 6.56.75.75 0 0 1 1.45.38A6.75 6.75 0 1 1 8 1.25c1.7 0 3.24.63 4.42 1.66V1.9a.75.75 0 0 1 1.5 0v3a.75.75 0 0 1-.75.75h-3a.75.75 0 0 1 0-1.5h1.36A5.23 5.23 0 0 0 8 2.75Z"/></svg>
        <span class="sidebar-refresh-label">Refresh</span>
      </button>
    </div>
  </aside>
    <main class="board" id="main" tabindex="-1">
      <form class="filters" id="filters" aria-label="Dashboard filters"></form>
      <div class="board-body" id="board-body"></div>
    </main>
  </div>

  <div class="drawer" id="drawer" hidden role="dialog" aria-modal="true" aria-labelledby="drawer-title">
    <div class="drawer-backdrop" data-close></div>
    <div class="drawer-panel">
      <header class="drawer-head">
        <div>
          <h2 id="drawer-title">Calls</h2>
          <p class="drawer-sub" id="drawer-sub"></p>
        </div>
        <button type="button" class="btn ghost" data-close aria-label="Close">Close</button>
      </header>
      <div class="drawer-body" id="drawer-body"></div>
    </div>
  </div>

  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="/assets/nav.js"></script>
  <script src="/assets/dashboard.js"></script>
  <script src="/assets/theme.js"></script>
</body>
</html>
