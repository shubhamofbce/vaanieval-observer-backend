<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Vaani Observer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d1526'/%3E%3Cg fill='%2359d3ab'%3E%3Crect x='6' y='13' width='3' height='6' rx='1.5'/%3E%3Crect x='12' y='8' width='3' height='16' rx='1.5'/%3E%3Crect x='18' y='11' width='3' height='10' rx='1.5'/%3E%3Crect x='24' y='14' width='3' height='4' rx='1.5'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <a class="skip-link" href="#call">Skip to call detail</a>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="26" height="26"><g fill="currentColor"><rect x="4" y="13" width="3" height="6" rx="1.5"/><rect x="10" y="7" width="3" height="18" rx="1.5"/><rect x="16" y="10" width="3" height="12" rx="1.5"/><rect x="22" y="13" width="3" height="6" rx="1.5"/></g></svg>
      </span>
      <span class="brand-text">
        <b>Vaani Observer</b>
        <small>Local voice-call observability</small>
      </span>
    </div>
    <div class="topbar-actions">
      <span class="conn-state" id="conn-state" role="status" aria-live="polite"></span>
      <button type="button" class="btn" id="refresh" title="Reload sessions (R)">
        <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true" class="icon-refresh"><path fill="currentColor" d="M8 2.75a5.25 5.25 0 1 0 5.09 6.56.75.75 0 0 1 1.45.38A6.75 6.75 0 1 1 8 1.25c1.7 0 3.24.63 4.42 1.66V1.9a.75.75 0 0 1 1.5 0v3a.75.75 0 0 1-.75.75h-3a.75.75 0 0 1 0-1.5h1.36A5.23 5.23 0 0 0 8 2.75Z"/></svg>
        Refresh
      </button>
    </div>
  </header>

  <div class="shell" id="shell">
    <nav class="rail" aria-label="Recorded calls">
      <div class="rail-head">
        <h2>Calls <span class="chip" id="session-count" aria-live="polite"></span></h2>
        <button type="button" class="rail-toggle" id="rail-toggle" aria-expanded="true" aria-controls="rail-panel" title="Hide the call list  ·  b" aria-label="Hide the call list">
          <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path fill="currentColor" d="M10.03 3.47a.75.75 0 0 1 0 1.06L6.56 8l3.47 3.47a.75.75 0 1 1-1.06 1.06L4.97 8.53a.75.75 0 0 1 0-1.06l4-4a.75.75 0 0 1 1.06 0Z"/></svg>
        </button>
      </div>
      <div class="rail-panel" id="rail-panel">
        <div class="rail-search">
          <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path fill="currentColor" d="M7 2a5 5 0 1 1-3.2 8.85l-2.32 2.33a.75.75 0 0 1-1.06-1.06l2.33-2.33A5 5 0 0 1 7 2Zm0 1.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/></svg>
          <input type="search" id="session-search" placeholder="Filter by agent or id" aria-label="Filter calls by agent or session id" autocomplete="off">
        </div>
        <div id="sessions" class="session-list" role="group" aria-label="Recorded calls"></div>
        <p class="rail-note" id="rail-note" hidden></p>
        <p class="rail-keys"><kbd>j</kbd><kbd>k</kbd> call · <kbd>/</kbd> filter · <kbd>b</kbd> hide list</p>
      </div>
    </nav>

    <main id="call" class="call" tabindex="-1"></main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>

  <script src="/assets/app.js"></script>
</body>
</html>
